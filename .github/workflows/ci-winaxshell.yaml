name: CI WinAxShell

on:
  push:
    paths:
      - 'winaxshell/**'
  pull_request:
    paths:
      - 'winaxshell/**'

defaults:
  run:
    working-directory: winaxshell

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: apt-get update >/dev/null && apt-get install -y libcriterion-dev build-essential >/dev/null

      - name: Build
        run: make

  test:
    runs-on: ubuntu-22.04
    needs: [build]
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: apt-get update >/dev/null && apt-get install -y libcriterion-dev build-essential >/dev/null

      - name: Build binary for tests
        run: make

      - name: Run unit & integration tests
        run: make tests
