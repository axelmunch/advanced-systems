name: CI WinAxShell docs

on:
  push:
    branches:
      - main
    paths:
      - 'winaxshell/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: winaxshell

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
        name: github-pages
        url: ${{steps.deployment.outputs.page_url}}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Documentation
        run: |
          sudo apt install doxygen graphviz -y
          make doc
          mv doc/ public/
      - name: Build GCOV Report
        run: |
          sudo apt install lcov libcriterion-dev -y
          make gcov
          mv gcov/ public/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './winaxshell/public'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
